name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      windows_only:
        description: Build only Windows and reuse the existing macOS asset
        required: true
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.provenance.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify release source
        id: provenance
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac

          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != tag ]; then
            echo "Release tag must be annotated: $RELEASE_TAG" >&2
            exit 1
          fi

          source_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          remote_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 {print $1}')"
          if [ "$(git rev-parse HEAD)" != "$source_sha" ] || [ "$remote_sha" != "$source_sha" ]; then
            echo "Release source does not match the remote tag" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=no)" ]; then
            echo "Tracked source is not clean" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_SHA" != "$source_sha" ]; then
            echo "Push SHA does not match the release tag" >&2
            exit 1
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Release source: $RELEASE_TAG -> $source_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file="docs/RELEASE-NOTES-${RELEASE_TAG}.md"
          if [ ! -f "$notes_file" ]; then
            echo "Release notes not found: $notes_file" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
              echo "Release already exists and is not a draft" >&2
              exit 1
            fi
            actual_body="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            expected_body="$(cat "$notes_file")"
            if [ "$actual_body" != "$expected_body" ]; then
              echo "Existing draft notes differ from $notes_file" >&2
              exit 1
            fi
            echo "::notice::Reusing existing draft release for $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "TmuxDeck $RELEASE_TAG" \
              --draft \
              --notes-file "$notes_file"
            echo "::notice::Draft release created for $RELEASE_TAG"
          fi

  build-macos:
    needs: create-release
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify release source
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.create-release.outputs.source_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ] || [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "macOS checkout does not match the release source" >&2
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run tauri build
      - name: Upload .dmg to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/dmg/*.dmg)
          version="${RELEASE_TAG#v}"
          if [ "${#files[@]}" -ne 1 ] || [ ! -s "${files[0]}" ] || [[ "$(basename "${files[0]}")" != *"$version"* ]]; then
            echo "Expected one non-empty versioned DMG" >&2
            exit 1
          fi
          name="$(basename "${files[0]}")"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
            echo "Release asset already exists: $name" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[0]}" --repo "$GITHUB_REPOSITORY"

  build-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify release source
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.create-release.outputs.source_sha }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          $tagHead = (git rev-parse "$env:RELEASE_TAG^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:EXPECTED_SOURCE_SHA -or $tagHead -ne $env:EXPECTED_SOURCE_SHA) {
            throw "Windows checkout does not match the release source"
          }
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Build
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.create-release.outputs.source_sha }}
        run: |
          $lastExit = 1
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if ($attempt -gt 1) {
              $delay = if ($attempt -eq 2) { 30 } else { 60 }
              Write-Warning "Tauri build attempt $attempt/3 after ${delay}s backoff"
              Start-Sleep -Seconds $delay
            }

            $head = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $head -ne $env:EXPECTED_SOURCE_SHA) {
              throw "Release source changed before build attempt $attempt"
            }
            $dirty = @(git status --porcelain=v1 --untracked-files=no)
            if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) {
              throw "Tracked source changed before build attempt $attempt"
            }

            Write-Host "Tauri tools cache: $env:LOCALAPPDATA\tauri"
            npm run tauri build
            $lastExit = $LASTEXITCODE
            if ($lastExit -eq 0) {
              Write-Host "Tauri build succeeded on attempt $attempt"
              exit 0
            }
            Write-Warning "Tauri build attempt $attempt failed with exit $lastExit"
          }
          exit $lastExit
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $exe = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File)
          $msi = @(Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -File)
          if ($exe.Count -ne 1 -or $msi.Count -ne 1 -or $exe[0].Length -eq 0 -or $msi[0].Length -eq 0) {
            throw "Expected one non-empty NSIS EXE and one non-empty MSI"
          }
          if (!$exe[0].Name.Contains($version) -or !$msi[0].Name.Contains($version)) {
            throw "Windows artifact filenames do not contain version $version"
          }

      - name: Azure login (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign artifacts (Azure Trusted Signing)
        if: env.TRUSTED_SIGNING_ENDPOINT != ''
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ env.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ env.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Windows artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          exe=(src-tauri/target/release/bundle/nsis/*.exe)
          msi=(src-tauri/target/release/bundle/msi/*.msi)
          version="${RELEASE_TAG#v}"
          if [ "${#exe[@]}" -ne 1 ] || [ "${#msi[@]}" -ne 1 ] || [ ! -s "${exe[0]}" ] || [ ! -s "${msi[0]}" ]; then
            echo "Expected one non-empty NSIS EXE and one non-empty MSI" >&2
            exit 1
          fi
          for file in "${exe[0]}" "${msi[0]}"; do
            name="$(basename "$file")"
            if [[ "$name" != *"$version"* ]]; then
              echo "Artifact filename does not contain version $version: $name" >&2
              exit 1
            fi
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "Release asset already exists: $name" >&2
              exit 1
            fi
          done
          gh release upload "$RELEASE_TAG" "${exe[0]}" "${msi[0]}" --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: [create-release, build-macos, build-windows]
    if: >-
      ${{
        always() &&
        needs.create-release.result == 'success' &&
        needs.build-windows.result == 'success' &&
        (
          needs.build-macos.result == 'success' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.windows_only == true &&
            needs.build-macos.result == 'skipped'
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SOURCE_SHA: ${{ needs.create-release.outputs.source_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ] || [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Publish checkout does not match the release source" >&2
            exit 1
          fi

          notes_file="docs/RELEASE-NOTES-${RELEASE_TAG}.md"
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "Release is no longer a draft" >&2
            exit 1
          fi
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)" != "$(cat "$notes_file")" ]; then
            echo "Draft release notes do not match $notes_file" >&2
            exit 1
          fi

          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | map({name, size})')"
          version="${RELEASE_TAG#v}"
          if [ "$(jq 'length' <<<"$assets")" -ne 3 ] || \
             [ "$(jq '[.[] | select(.name | endswith(".dmg"))] | length' <<<"$assets")" -ne 1 ] || \
             [ "$(jq '[.[] | select(.name | endswith(".exe"))] | length' <<<"$assets")" -ne 1 ] || \
             [ "$(jq '[.[] | select(.name | endswith(".msi"))] | length' <<<"$assets")" -ne 1 ] || \
             [ "$(jq --arg version "$version" '[.[] | select(.size <= 0 or (.name | contains($version) | not))] | length' <<<"$assets")" -ne 0 ]; then
            echo "Release must contain exactly one non-empty versioned DMG, EXE, and MSI" >&2
            exit 1
          fi

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

          state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
          if [ "$state" != $'false\tfalse' ] || [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" != "$RELEASE_TAG" ]; then
            echo "Published release state verification failed" >&2
            exit 1
          fi
          echo "::notice::Published release $RELEASE_TAG"
