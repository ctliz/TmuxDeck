name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TmuxDeck ${{ github.ref_name }}
          body: |
            ## TmuxDeck v1.6.0

            A major UI overhaul and the first release with a menu bar presence. Since v1.5.0: Liquid Glass design, a tray icon, terminal brand icons, and pane-level management.

            ### Liquid Glass UI

            The interface was rebuilt around macOS 26-style Liquid Glass: translucent surfaces, soft blur, and smooth transitions. The heavy top bar is gone - a floating, semi-transparent search pill sits at the top.

            Cards were simplified to the essentials: a status dot, a click-to-rename name, and a close button. The pane grid shows live output tail from each pane.

            ### Menu bar (tray) presence

            TmuxDeck now lives in the menu bar. Close the window and it keeps running - click the tray icon to see the active workspace, open any session, add a pane, or create a new one. The tray menu follows the system language (English / Simplified Chinese).

            ### Terminal brand icons

            Each card shows the real icon of every installed terminal (extracted from the app bundle at runtime). One click opens the session in that terminal.

            ### Pane-level management

            Hover a pane to kill just that pane (with confirmation), or click "Add pane" to grow the grid - each new pane inherits the session's working directory.

            ### Fixes

            - Tray menu labels are now localized (previously hard-coded English).
            - Removed dead activity-text computation and orphaned i18n keys.

            ### Install

            - macOS: download the `.dmg`, drag into Applications. If Gatekeeper warns on first launch, right-click -> Open (unsigned build).
            - Windows: download the `.exe` (NSIS) or `.msi`.
          draft: true
          generate_release_notes: true

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run tauri build
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run tauri build

      - name: Azure login (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign artifacts (Azure Trusted Signing)
        if: env.TRUSTED_SIGNING_ENDPOINT != ''
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ env.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ env.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
