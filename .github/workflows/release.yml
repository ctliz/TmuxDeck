name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.provenance.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify release source
        id: provenance
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac

          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != tag ]; then
            echo "Release tag must be annotated: $RELEASE_TAG" >&2
            exit 1
          fi

          source_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          remote_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 {print $1}')"
          if [ "$(git rev-parse HEAD)" != "$source_sha" ] || [ "$remote_sha" != "$source_sha" ]; then
            echo "Release source does not match the remote tag" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=no)" ]; then
            echo "Tracked source is not clean" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_SHA" != "$source_sha" ]; then
            echo "Push SHA does not match the release tag" >&2
            exit 1
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Release source: $RELEASE_TAG -> $source_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file="docs/RELEASE-NOTES-${RELEASE_TAG}.md"
          if [ ! -f "$notes_file" ]; then
            echo "Release notes not found: $notes_file" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
              echo "Release already exists and is not a draft" >&2
              exit 1
            fi
            actual_body="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            expected_body="$(cat "$notes_file")"
            if [ "$actual_body" != "$expected_body" ]; then
              echo "Existing draft notes differ from $notes_file" >&2
              exit 1
            fi
            echo "::notice::Reusing existing draft release for $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "TmuxDeck $RELEASE_TAG" \
              --draft \
              --notes-file "$notes_file"
            echo "::notice::Draft release created for $RELEASE_TAG"
          fi

  build-macos:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify release source
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.create-release.outputs.source_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ] || [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "macOS checkout does not match the release source" >&2
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Zig
        run: node scripts/setup-zig.cjs
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            npm run tauri build
          else
            echo "::warning::APPLE_CERTIFICATE secret is missing, falling back to unsigned build"
            npm run tauri build -- --no-sign
          fi
      - name: Notarize and staple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_BASE64" ]; then
            echo "::warning::Apple notarization secrets missing, skipping notarize"
            exit 0
          fi
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -s "${dmgs[0]}" ]; then
            echo "Expected one DMG to notarize" >&2
            exit 1
          fi
          dmg="${dmgs[0]}"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$key"

          submit_json=""
          for attempt in 1 2 3 4 5; do
            if submit_json="$(xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --output-format json)"; then
              break
            fi
            echo "notarytool submit failed (attempt $attempt), retrying in 20s"
            sleep 20
            submit_json=""
          done
          if [ -z "$submit_json" ]; then
            echo "notarytool submit failed after retries" >&2
            exit 1
          fi
          echo "$submit_json"
          submission_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$submit_json")"
          if [ -z "$submission_id" ] || [ "$submission_id" = "None" ]; then
            echo "No notarization submission id" >&2
            exit 1
          fi
          echo "Notary submission: $submission_id"

          status=""
          deadline=$((SECONDS + 10800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if info_json="$(xcrun notarytool info "$submission_id" --key "$key" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --output-format json)"; then
              echo "$info_json"
              status="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' <<<"$info_json")"
              case "$status" in
                Accepted) break ;;
                Invalid|Rejected)
                  xcrun notarytool log "$submission_id" --key "$key" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
                  echo "Notarization $status" >&2
                  exit 1
                  ;;
              esac
            else
              echo "notarytool info failed, retrying"
            fi
            sleep 30
          done
          if [ "$status" != "Accepted" ]; then
            echo "Notarization did not finish in time (status=${status:-unknown})" >&2
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - name: Upload macOS artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/dmg/*.dmg)
          version="${RELEASE_TAG#v}"
          if [ "${#files[@]}" -ne 1 ] || [ ! -s "${files[0]}" ] || [[ "$(basename "${files[0]}")" != *"$version"* ]]; then
            echo "Expected one non-empty versioned DMG" >&2
            exit 1
          fi
          name="$(basename "${files[0]}")"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
            gh release upload "$RELEASE_TAG" "${files[0]}" --repo "$GITHUB_REPOSITORY"
          fi

          updater_files=(src-tauri/target/release/bundle/macos/*.tar.gz src-tauri/target/release/bundle/macos/*.tar.gz.sig)
          for uf in "${updater_files[@]}"; do
            if [ -s "$uf" ]; then
              uname="$(basename "$uf")"
              if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$uname"; then
                echo "Uploading macOS updater asset: $uname"
                gh release upload "$RELEASE_TAG" "$uf" --repo "$GITHUB_REPOSITORY"
              fi
            fi
          done

  build-windows:
    needs: create-release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify release source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.create-release.outputs.source_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ] || [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Windows checkout does not match the release source" >&2
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Zig
        run: node scripts/setup-zig.cjs
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build
      - name: Upload Windows installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi)
          version="${RELEASE_TAG#v}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Expected at least one Windows installer (.exe or .msi)" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            if [ -s "$file" ] && [[ "$(basename "$file")" == *"$version"* ]]; then
              name="$(basename "$file")"
              if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
                echo "Uploading Windows asset: $name"
                gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
              fi
            fi
          done

          updater_files=(src-tauri/target/release/bundle/nsis/*.nsis.zip src-tauri/target/release/bundle/nsis/*.nsis.zip.sig)
          for uf in "${updater_files[@]}"; do
            if [ -s "$uf" ]; then
              uname="$(basename "$uf")"
              if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$uname"; then
                echo "Uploading Windows updater asset: $uname"
                gh release upload "$RELEASE_TAG" "$uf" --repo "$GITHUB_REPOSITORY"
              fi
            fi
          done

  publish-release:
    needs: [create-release, build-macos, build-windows]
    if: >-
      ${{ always() && needs.create-release.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SOURCE_SHA: ${{ needs.create-release.outputs.source_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ] || [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Publish checkout does not match the release source" >&2
            exit 1
          fi

          notes_file="docs/RELEASE-NOTES-${RELEASE_TAG}.md"
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "Release is no longer a draft" >&2
            exit 1
          fi
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)" != "$(cat "$notes_file")" ]; then
            echo "Draft release notes do not match $notes_file" >&2
            exit 1
          fi

          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | map({name, size})')"
          version="${RELEASE_TAG#v}"
          dmg_count="$(jq '[.[] | select(.name | endswith(".dmg"))] | length' <<<"$assets")"
          win_count="$(jq '[.[] | select(.name | (endswith(".exe") or endswith(".msi")))] | length' <<<"$assets")"
          invalid_count="$(jq --arg version "$version" '[.[] | select(.size <= 0 or ((.name | test("\\.(dmg|exe|msi)$")) and (.name | contains($version) | not)))] | length' <<<"$assets")"

          if [ "$dmg_count" -lt 1 ] || [ "$win_count" -lt 1 ] || [ "$invalid_count" -ne 0 ]; then
            echo "Release must contain non-empty versioned DMG and Windows installer assets" >&2
            echo "Assets: $assets" >&2
            exit 1
          fi

      - name: Generate and upload updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/updater-sigs
          # Download signature files from draft release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.sig" --dir /tmp/updater-sigs || true
          
          node -e '
            const fs = require("fs");
            const path = require("path");
            const tag = process.env.RELEASE_TAG;
            const repo = process.env.GITHUB_REPOSITORY;
            const version = tag.replace(/^v/, "");
            const notesFile = `docs/RELEASE-NOTES-${tag}.md`;
            const notes = fs.existsSync(notesFile) ? fs.readFileSync(notesFile, "utf8") : "";
            const pub_date = new Date().toISOString();
            
            const sigDir = "/tmp/updater-sigs";
            const files = fs.existsSync(sigDir) ? fs.readdirSync(sigDir) : [];
            const platforms = {};
            
            // Darwin aarch64 (Apple Silicon)
            const macSig = files.find(f => (f.includes("aarch64") && f.endsWith(".tar.gz.sig")) || f.endsWith(".app.tar.gz.sig"));
            if (macSig) {
              const sig = fs.readFileSync(path.join(sigDir, macSig), "utf8").trim();
              const tarFile = macSig.replace(/\.sig$/, "");
              platforms["darwin-aarch64"] = {
                signature: sig,
                url: `https://github.com/${repo}/releases/download/${tag}/${tarFile}`
              };
            }

            // Darwin x86_64 (Intel)
            const macIntelSig = files.find(f => (f.includes("x86_64") || f.includes("x64")) && f.endsWith(".tar.gz.sig"));
            if (macIntelSig) {
              const sig = fs.readFileSync(path.join(sigDir, macIntelSig), "utf8").trim();
              const tarFile = macIntelSig.replace(/\.sig$/, "");
              platforms["darwin-x86_64"] = {
                signature: sig,
                url: `https://github.com/${repo}/releases/download/${tag}/${tarFile}`
              };
            }
            
            // Windows x86_64
            const winSig = files.find(f => f.endsWith(".nsis.zip.sig") || f.endsWith(".zip.sig"));
            if (winSig) {
              const sig = fs.readFileSync(path.join(sigDir, winSig), "utf8").trim();
              const zipFile = winSig.replace(/\.sig$/, "");
              platforms["windows-x86_64"] = {
                signature: sig,
                url: `https://github.com/${repo}/releases/download/${tag}/${zipFile}`
              };
            }
            
            if (Object.keys(platforms).length > 0) {
              const manifest = {
                version: tag,
                notes,
                pub_date,
                platforms
              };
              fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
              console.log("Generated latest.json:\n" + JSON.stringify(manifest, null, 2));
            } else {
              console.log("No updater signature files found, skipping latest.json");
            }
          '
          
          if [ -f "latest.json" ]; then
            gh release upload "$RELEASE_TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
            echo "Uploaded latest.json to release $RELEASE_TAG"
          fi

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

          state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
          if [ "$state" != $'false\tfalse' ] || [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" != "$RELEASE_TAG" ]; then
            echo "Published release state verification failed" >&2
            exit 1
          fi
          echo "::notice::Published release $RELEASE_TAG"
