name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat <<'EOF' > /tmp/release-notes.md
          ## TmuxDeck v1.7.0

          Since v1.6.0, five feature increments shipped in one release: a menu bar presence with full session control, real terminal brand icons, a streamlined card header, pane-level management, and duplicate-window protection. This is the largest quality-of-life release since Liquid Glass.

          ### Menu bar presence

          TmuxDeck now lives in the menu bar. Close the window and it keeps running - the tray icon shows the active workspace, and the menu lets you open any session, add a pane, or create a new one without opening the main window.

          - Active workspace section: opens in your default terminal, adds a pane, shows last activity.
          - Full session list sorted by activity (attached first, then most recently used), up to 8 shown with a "view all" entry.
          - The tray menu follows the system language (English / Simplified Chinese) and refreshes every 5 seconds.

          ### Terminal brand icons

          Each card's footer is now a row of real terminal icons (extracted from each installed app bundle at runtime, with built-in SVG fallbacks). One click opens the session in that terminal - no more dropdown. The default terminal is highlighted.

          ### Streamlined card header

          Card headers are now just a status dot, a click-to-rename name, and a close button. The hover-only rename/delete buttons and the "X windows - Y panes" statistics line are gone.

          ### Pane-level management

          Workspaces are no longer all-or-nothing. Hover a pane preview tile to kill just that pane (with confirmation; hidden when the session has a single pane), or click "Add pane" to grow the grid - each new pane inherits the session's working directory.

          ### Duplicate-window protection

          Clicking a session that is already attached no longer spawns another terminal window. TmuxDeck focuses the existing window instead - precisely via window title on macOS (falls back to activating the terminal app), and via AppActivate on Windows.

          ### Fixes

          - Tray menu labels are now localized (previously hard-coded English).
          - Removed dead activity-text computation and orphaned i18n keys after the header cleanup.

          ### Install

          - macOS: download the `.dmg`, drag into Applications. If Gatekeeper warns on first launch, right-click -> Open (unsigned build).
          - Windows: download the `.exe` (NSIS) or `.msi`.
          EOF
          gh release create "${{ github.ref_name }}" \
            --title "TmuxDeck ${{ github.ref_name }}" \
            --draft \
            --notes-file /tmp/release-notes.md
          echo "::notice::Draft release created for ${{ github.ref_name }}"

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run tauri build
      - name: Upload .dmg to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/dmg/*.dmg \
            --clobber

  build-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run tauri build

      - name: Azure login (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign artifacts (Azure Trusted Signing)
        if: env.TRUSTED_SIGNING_ENDPOINT != ''
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ env.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ env.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Windows artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            --clobber
