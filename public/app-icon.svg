<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient (Obsidian to Midnight Blue) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181E29" />
      <stop offset="40%" stop-color="#0F131C" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Top Glass Reflection Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Active Pane Neon Cyan Gradient -->
    <linearGradient id="activePaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Secondary Panes Cyan-Blue Gradient -->
    <linearGradient id="secondaryPaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.75" />
    </linearGradient>

    <!-- Prompt Symbol White-Cyan Glow Gradient -->
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" opacity="0.6" />
        <feMergeNode in="blur2" opacity="0.9" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pane Glow Filter -->
    <filter id="paneGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.5" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer macOS Squircle Container -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" />

  <!-- Glass Top Reflection Curve -->
  <path d="M 64 264 C 64 153.5 153.5 64 264 64 L 760 64 C 870.5 64 960 153.5 960 264 L 960 380 Q 512 480 64 380 Z" fill="url(#glassGrad)" />

  <!-- Inner Glass Border Frame -->
  <rect x="80" y="80" width="864" height="864" rx="184" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.12" />

  <!-- Inner Deck Platform Base -->
  <rect x="120" y="120" width="784" height="784" rx="150" fill="#0A0D14" fill-opacity="0.75" stroke="#1E293B" stroke-width="4" stroke-opacity="0.6" />

  <!-- 2x2 Tmux Pane Grid -->
  <!-- Top-Left Active Pane (Cyan Neon Glow) -->
  <rect x="168" y="168" width="324" height="324" rx="44" fill="#111622" fill-opacity="0.9" stroke="url(#activePaneGrad)" stroke-width="7" filter="url(#paneGlow)" />

  <!-- Top-Right Pane -->
  <rect x="532" y="168" width="324" height="324" rx="44" fill="#111622" fill-opacity="0.85" stroke="url(#secondaryPaneGrad)" stroke-width="5" stroke-opacity="0.8" />

  <!-- Bottom-Left Pane -->
  <rect x="168" y="532" width="324" height="324" rx="44" fill="#111622" fill-opacity="0.85" stroke="url(#secondaryPaneGrad)" stroke-width="5" stroke-opacity="0.8" />

  <!-- Bottom-Right Pane -->
  <rect x="532" y="532" width="324" height="324" rx="44" fill="#111622" fill-opacity="0.85" stroke="url(#secondaryPaneGrad)" stroke-width="5" stroke-opacity="0.85" filter="url(#paneGlow)" />

  <!-- Prompt Command Symbol >_ in Top-Left Active Pane -->
  <!-- Chevron '>' -->
  <path d="M 236 264 L 308 312 L 236 360" fill="none" stroke="url(#promptGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  <!-- Underscore Cursor '_' -->
  <path d="M 332 360 L 396 360" fill="none" stroke="url(#promptGrad)" stroke-width="22" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Active Session Dot Indicator (Top Right of Active Pane) -->
  <circle cx="444" cy="216" r="10" fill="#00F2FE" filter="url(#neonGlow)" />
</svg>
