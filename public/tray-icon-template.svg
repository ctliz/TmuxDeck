<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- 2x2 Grid Panes (Monochrome for macOS Menu Bar Template) -->
  <rect x="4" y="4" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="2.5" />
  <rect x="34" y="4" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="2.5" />
  <rect x="4" y="34" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="2.5" />
  <rect x="34" y="34" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="2.5" />

  <!-- Prompt Command Symbol >_ in Top-Left Pane -->
  <path d="M 10 10 L 16 15 L 10 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 18 20 L 24 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
</svg>
