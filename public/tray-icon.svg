<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- TmuxDeck Menu Bar Tray Icon (White + Gray, Transparent Canvas) -->
  
  <!-- Top-Left Active Pane (Solid Crisp White Border) -->
  <rect x="6" y="6" width="22" height="22" rx="5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-opacity="1.0" />
  
  <!-- Secondary Inactive Panes (Slate Gray / Semi-translucent White Border) -->
  <rect x="36" y="6" width="22" height="22" rx="5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-opacity="0.45" />
  <rect x="6" y="36" width="22" height="22" rx="5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-opacity="0.45" />
  <rect x="36" y="36" width="22" height="22" rx="5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-opacity="0.45" />

  <!-- Prompt Command Symbol >_ in Top-Left Active Pane (Crisp Pure White) -->
  <path d="M 11.5 12 L 17 17 L 11.5 22" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" />
  <path d="M 19 22 L 23.5 22" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="1.0" />
</svg>
