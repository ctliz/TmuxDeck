<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181E29" />
      <stop offset="50%" stop-color="#0F131C" />
      <stop offset="100%" stop-color="#090C12" />
    </linearGradient>

    <!-- Glowing Border Gradient (Cyan to Emerald) -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <!-- Prompt Cyan Glow -->
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Outer Rim Metallic Glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.8" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Soft Glow Filter -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.6" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Glass Inner Reflection Layer -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.1" />

  <!-- 2x2 Tmux Pane Grid Containers -->
  <!-- Top-Left Pane -->
  <rect x="64" y="64" width="180" height="180" rx="28" fill="#131924" fill-opacity="0.8" stroke="url(#gridGrad)" stroke-width="3.5" filter="url(#softGlow)" />
  
  <!-- Top-Right Pane -->
  <rect x="268" y="64" width="180" height="180" rx="28" fill="#131924" fill-opacity="0.8" stroke="url(#gridGrad)" stroke-width="3.5" stroke-opacity="0.85" />
  
  <!-- Bottom-Left Pane -->
  <rect x="64" y="268" width="180" height="180" rx="28" fill="#131924" fill-opacity="0.8" stroke="url(#gridGrad)" stroke-width="3.5" stroke-opacity="0.85" />
  
  <!-- Bottom-Right Pane -->
  <rect x="268" y="268" width="180" height="180" rx="28" fill="#131924" fill-opacity="0.8" stroke="url(#gridGrad)" stroke-width="3.5" stroke-opacity="0.9" filter="url(#softGlow)" />

  <!-- Prompt Command Symbol >_ in Top-Left Pane -->
  <!-- Chevron '>' -->
  <path d="M 104 120 L 144 148 L 104 176" fill="none" stroke="url(#promptGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  <!-- Underscore Cursor '_' -->
  <path d="M 158 176 L 194 176" fill="none" stroke="url(#promptGrad)" stroke-width="14" stroke-linecap="round" filter="url(#neonGlow)" />
</svg>
