[package]
name = "tauri-app"
version = "1.14.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api 是 transparent 窗口在 macOS 上生效的前提（托盘面板需要）。
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
dirs = "5"
sys-locale = "0.3"
# v1.14 手机端 WebSocket 传输：
# tokio 已在依赖树（tauri 传递），这里补齐 net/time features 并显式声明使用；
# futures-util / getrandom 同样已在树中，不引入新下载。
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread", "sync", "io-util"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
getrandom = "0.2"
sha2 = "0.10"
toml_edit = "=0.25.13"

